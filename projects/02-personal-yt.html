<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal experiment + YT video</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <div class="container">
      <div class="top-bar">
        <a class="back-link" href="../index.html">← Back to Portfolio</a>
        <nav class="nav-links" aria-label="External links">
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="project-article">
      <span class="badge personal">Personal Work</span>
      <h1 class="project-title">Personal experiment + YT video</h1>
      <p class="project-desc">
        Personal after-hours experiment. Replace VIDEO_ID below with your YouTube video ID.
      </p>

      <div class="media-block">
        <div class="yt-box">
          <iframe
            src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
            title="YouTube video preview"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </article>
  </main>
</body>
