<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="siteHeader"></header>

  <main class="container">
    <div class="filters" role="tablist" aria-label="Project filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="com">Commercial Gamedev Work</button>
      <button class="filter-btn" data-filter="personal">Personal Gamedev Stuff</button>
      <button class="filter-btn" data-filter="cad">CAD & 3D Printing</button>
    </div>

    <div id="projectsGrid" class="grid"></div>
  </main>

  <script>
    const CATEGORY_LABELS = {
      com: "Commercial Gamedev Work",
      personal: "Personal Gamedev Stuff",
      cad: "CAD & 3D Printing"
    };

    const headerEl = document.getElementById("siteHeader");
    const grid = document.getElementById("projectsGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let allProjects = [];
    let activeFilter = "all";

    function nl2br(str = "") {
      return String(str)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/\n/g, "<br>");
    }

    function renderHeader(header) {
      const linksHtml = (header.links || [])
        .map(l => `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`)
        .join("");

      const roleHtml = header.role
        ? `<p class="role" style="color: var(--muted); font-weight: 500; margin-top: 2px;">${nl2br(header.role)}</p>`
        : "";

      headerEl.innerHTML = `
        <div class="container">
          <div class="top-bar">
            <div>
              <h1>${nl2br(header.name)}</h1>
              ${roleHtml}
            </div>
            <nav class="nav-links" aria-label="External links">${linksHtml}</nav>
          </div>
          <p class="bio">${nl2br(header.bio)}</p>
        </div>
      `;
    }

    function renderProjects() {
      const filtered = activeFilter === "all"
        ? allProjects
        : allProjects.filter(p => p.category === activeFilter);

      grid.innerHTML = filtered.map(p => `
        <a class="card" href="${p.url}">
          <div class="thumb-wrap">
            <img src="${p.thumb}" alt="${p.title}" loading="lazy" />
          </div>
          <div class="card-body">
            <span class="card-title">${p.title}</span>
            <span class="badge ${p.category}">${CATEGORY_LABELS[p.category] || p.category}</span>
          </div>
        </a>
      `).join("");
    }

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderProjects();
      });
    });

    async function loadProject(code) {
      const cleanCode = String(code).trim().toLowerCase();
      const url = `projects/${cleanCode}.html`;
      const category = cleanCode.split("_")[0];
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Nie znaleziono ${url}`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      const title =
        doc.querySelector(".project-title")?.textContent.trim() ||
        doc.querySelector("title")?.textContent.trim() ||
        cleanCode;

      const thumb =
        doc.querySelector("article")?.dataset.thumb ||
        `https://placehold.co/800x500/e2e8f0/1e293b?text=${encodeURIComponent(title)}`;

      return { code: cleanCode, url, category, title, thumb };
    }

    fetch("projects.json")
      .then(r => r.json())
      .then(async data => {
        renderHeader(data.header || {});
        allProjects = await Promise.all((data.projects || []).map(loadProject));
        renderProjects();
      })
      .catch(err => {
        console.error(err);
        grid.innerHTML = `<p>Błąd ładowania: ${err.message}</p>`;
      });
  </script>
</body>
</html>
