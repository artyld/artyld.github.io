<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Commercial & Personal Work</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <div class="top-bar">
        <h1>Arty W / <br>
          Level Designer / Gameplay Designer/ World Builder</h1>
        <nav class="nav-links" aria-label="External links">
          <a href="https://www.linkedin.com/in/arty123/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.mobygames.com/person/754339/artur-wiechiec/credits/" target="_blank" rel="noopener noreferrer">MobyGames</a>
        </nav>
      </div>
      <p class="bio">
        Designing game spaces from the ground up, hooked on gaming since the Commodore days. <br>
        Off the clock, I hit the cycling trails or dive into CAD to design functional parts for 3D printing. 
      </p>
    </div>
  </header>

  <main class="container">
    <div class="filters" role="tablist" aria-label="Project filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="commercial">Commercial Work</button>
      <button class="filter-btn" data-filter="personal">Personal Work</button>
    </div>

    <div id="projectsGrid" class="grid"></div>
  </main>

  <script>
    const grid = document.getElementById("projectsGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");
    let allProjects = [];
    let activeFilter = "all";

    function renderProjects() {
      const filtered = activeFilter === "all"
        ? allProjects
        : allProjects.filter(p => p.category === activeFilter);

      grid.innerHTML = filtered.map(project => {
        const isPersonal = project.category === "personal";
        const label = isPersonal ? "Personal Work" : "Commercial Work";
        return `
          <a class="card" href="${project.url}">
            <div class="thumb-wrap">
              <img src="${project.thumb}" alt="${project.title}" loading="lazy" />
            </div>
            <div class="card-body">
              <span class="card-title">${project.title}</span>
              <span class="badge ${isPersonal ? "personal" : ""}">${label}</span>
            </div>
          </a>
        `;
      }).join("");
    }

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderProjects();
      });
    });

    fetch("projects.json")
      .then(res => res.json())
      .then(data => {
        allProjects = data;
        renderProjects();
      })
      .catch(() => {
        grid.innerHTML = "<p>Could not load projects.json.</p>";
      });
  </script>
</body>
</html>
