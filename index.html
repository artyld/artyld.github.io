<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Commercial & Personal Work</title>
  <style>
    :root {
      --surface: rgba(255, 255, 255, 0.92);
      --text: #14171a;
      --muted: #5c6672;
      --accent: #0057ff;
      --border: #e3e8ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #f8fafc 0%, #eef2f7 55%, #f4f6fa 100%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-links a:hover {
      background: #eef3ff;
      color: var(--accent);
    }
    .bio {
      color: var(--muted);
      max-width: 660px;
      margin-top: 8px;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin: 24px 0 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
      padding-bottom: 60px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }
    .thumb-wrap {
      aspect-ratio: 16 / 10;
      background: #e9edf2;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .card-title { font-weight: 600; font-size: 1rem; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: #eef3ff;
      color: var(--accent);
    }
    .badge.personal {
      background: #eefaf2;
      color: #16794c;
    }

    /* Project preview modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 20, 26, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #ffffff;
      border-radius: 12px;
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }
    .close-btn {
      background: #f1f3f6;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-desc { color: var(--muted); margin-bottom: 18px; }
    .media-block { margin-bottom: 18px; }
    .media-block img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    .yt-box {
      aspect-ratio: 16 / 9;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    .yt-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="top-bar">
        <h1>Your Name / Handle</h1>
        <nav class="nav-links" aria-label="External links">
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
        </nav>
      </div>
      <p class="bio">
        Short introduction about what you do. Below you will find selected commercial work and personal after-hours projects.
      </p>
    </div>
  </header>

  <main class="container">
    <div class="filters" role="tablist" aria-label="Project filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="commercial">Commercial Work</button>
      <button class="filter-btn" data-filter="personal">Personal Work</button>
    </div>

    <div id="projectsGrid" class="grid"></div>
  </main>

  <div id="projectModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <div>
          <span id="modalBadge" class="badge"></span>
          <h2 id="modalTitle" style="margin-top: 8px; font-size: 1.4rem;"></h2>
        </div>
        <button id="closeModal" class="close-btn" aria-label="Close preview">×</button>
      </div>
      <p id="modalDesc" class="modal-desc"></p>
      <div id="modalMedia"></div>
    </div>
  </div>

  <script>
    // EDIT ONLY THIS DATA — add or update your projects
    const PROJECTS = [
      {
        id: 1,
        title: "Commercial project — sample",
        category: "commercial", // "commercial" or "personal"
        thumb: "https://placehold.co/800x500/e2e8f0/1e293b?text=Commercial+Work",
        images: [
          "https://placehold.co/1000x600/e2e8f0/1e293b?text=Frame+1"
        ],
        youtubeId: "", // paste only the YouTube video ID, e.g. "dQw4w9WgXcQ"
        description: "Role in the project, tools used, and final outcome (respecting NDA guidelines)."
      },
      {
        id: 2,
        title: "Personal experiment + YT video",
        category: "personal",
        thumb: "https://placehold.co/800x500/dcfce7/14532d?text=Personal+Work",
        images: [],
        youtubeId: "", // paste a YouTube ID to display the player inside the modal preview
        description: "Personal project created after hours. Once you add a youtubeId, the video plays right here."
      }
    ];

    const grid = document.getElementById("projectsGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const modal = document.getElementById("projectModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBadge = document.getElementById("modalBadge");
    const modalDesc = document.getElementById("modalDesc");
    const modalMedia = document.getElementById("modalMedia");
    const closeModalBtn = document.getElementById("closeModal");

    let activeFilter = "all";

    function renderProjects() {
      const filtered = activeFilter === "all"
        ? PROJECTS
        : PROJECTS.filter(p => p.category === activeFilter);

      grid.innerHTML = filtered.map(project => {
        const isPersonal = project.category === "personal";
        const label = isPersonal ? "Personal Work" : "Commercial Work";
        return `
          <article class="card" data-id="${project.id}">
            <div class="thumb-wrap">
              <img src="${project.thumb}" alt="${project.title}" loading="lazy" />
            </div>
            <div class="card-body">
              <span class="card-title">${project.title}</span>
              <span class="badge ${isPersonal ? "personal" : ""}">${label}</span>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => openProject(Number(card.dataset.id)));
      });
    }

    function openProject(id) {
      const project = PROJECTS.find(p => p.id === id);
      if (!project) return;

      const isPersonal = project.category === "personal";
      modalTitle.textContent = project.title;
      modalBadge.textContent = isPersonal ? "Personal Work" : "Commercial Work";
      modalBadge.className = "badge" + (isPersonal ? " personal" : "");
      modalDesc.textContent = project.description;

      let mediaHtml = "";
      if (project.youtubeId) {
        mediaHtml += `
          <div class="media-block">
            <div class="yt-box">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(project.youtubeId)}"
                title="${project.title}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        `;
      }
      if (Array.isArray(project.images)) {
        project.images.forEach(src => {
          mediaHtml += `
            <div class="media-block">
              <img src="${src}" alt="${project.title}" loading="lazy" />
            </div>
          `;
        });
      }

      modalMedia.innerHTML = mediaHtml;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalMedia.innerHTML = "";
    }

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderProjects();
      });
    });

    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    renderProjects();
  </script>
</body>
</html>
