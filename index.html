<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="siteHeader"></header>

  <main class="container">
    <div class="filters" role="tablist" aria-label="Project filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="commercial">Commercial Gamedev Work</button>
      <button class="filter-btn" data-filter="personal">Personal Gamedev Stuff</button>
      <button class="filter-btn" data-filter="cad">CAD & 3D Printing</button>
    </div>

    <div id="projectsGrid" class="grid"></div>
  </main>

  <script>
    const headerEl = document.getElementById("siteHeader");
    const grid = document.getElementById("projectsGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");

    const CATEGORY_LABELS = {
      commercial: "Commercial Gamedev Work",
      personal: "Personal Gamedev Stuff",
      cad: "CAD & 3D Printing"
    };

    let allProjects = [];
    let activeFilter = "all";

    function renderHeader(header) {
      const linksHtml = (header.links || [])
        .map(l => `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a>`)
        .join("");

      headerEl.innerHTML = `
        <div class="container">
          <div class="top-bar">
            <h1>${header.name}</h1>
            <nav class="nav-links" aria-label="External links">${linksHtml}</nav>
          </div>
          <p class="bio">${header.bio}</p>
        </div>
      `;
    }

    function renderProjects() {
      const filtered = activeFilter === "all"
        ? allProjects
        : allProjects.filter(p => p.category === activeFilter);

      grid.innerHTML = filtered.map(project => {
        const label = CATEGORY_LABELS[project.category] || project.category;
        return `
          <a class="card" href="${project.url}">
            <div class="thumb-wrap">
              <img src="${project.thumb}" alt="${project.title}" loading="lazy" />
            </div>
            <div class="card-body">
              <span class="card-title">${project.title}</span>
              <span class="badge ${project.category}">${label}</span>
            </div>
          </a>
        `;
      }).join("");
    }

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderProjects();
      });
    });

    async function loadProjectMeta(code) {
      const url = `projects/${code}.html`;
      const res = await fetch(url);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const article = doc.querySelector("article[data-category]");

      const category = article?.dataset.category || "commercial";
      const thumb = article?.dataset.thumb || "https://placehold.co/800x500/e2e8f0/1e293b?text=" + encodeURIComponent(code);
      const title =
        doc.querySelector(".project-title")?.textContent.trim() ||
        doc.querySelector("title")?.textContent.trim() ||
        code;

      return { code, url, category, thumb, title };
    }

    fetch("projects.json")
      .then(res => res.json())
      .then(async data => {
        renderHeader(data.header);
        allProjects = await Promise.all((data.projects || []).map(loadProjectMeta));
        renderProjects();
      })
      .catch(() => {
        grid.innerHTML = "<p>Could not load projects.json.</p>";
      });
  </script>
</body>
</html>
